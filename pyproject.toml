[project]
name = "RLGT"
version = "0.1.0"
description = "This is Reinforcement Learning for Graph Theory (RLGT), a reinforcement learning framework that aims to facilitate future research in extremal graph theory."
authors = [ { name = "Ivan Damnjanović" }, { name = "Uroš Milivojević" }, { name = "Irena Đorđević" }, { name = "Dragan Stevanović" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [ "numpy>=2.3.4,<3.0" ]

[project.optional-dependencies]
agents = [ "torch>=2.8,<3.0" ]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "rlgt", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^25.9.0"
isort = "^7.0.0"
pydoctor = "^25.10.1"
pytest-cov = "^7.0.0"

[tool.black]
line-length = 99
target-version = ['py37']

[tool.isort]
profile = "black"
lines_after_imports = 2

[tool.pydoctor]
project-name = "rlgt"
add-package = ["src/rlgt"]
docformat = "restructuredtext"
make-html = true
html-output = "docs"
intersphinx = [
    "https://docs.python.org/3/objects.inv",
    "https://numpy.org/doc/stable/objects.inv",
    "https://pytorch.org/docs/stable/objects.inv",
]

