[tool.poetry]
name = "rl-graph-theory"
version = "0.1.0"
packages = [{ include = "rl_graph_theory", from = "src" }]
description = "This is a reinforcement learning framework that aims to facilitate research in extremal graph theory."
authors = ["Ivan Damnjanović"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.3.4"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^25.9.0"
isort = "^7.0.0"
pydoctor = "^25.10.1"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 99
target-version = ['py37']


[tool.isort]
profile = "black"
lines_after_imports = 2

[tool.pydoctor]
project-name = "rl-graph-theory"
add-package = ["src/rl_graph_theory"]
docformat = "restructuredtext"
make-html = true
html-output = "docs"
intersphinx = [
    "https://docs.python.org/3/objects.inv",
    "https://numpy.org/doc/stable/objects.inv",
    "https://pytorch.org/docs/stable/objects.inv",
]

